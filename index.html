<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오점뭐? 🍽️ (오늘 점심 뭐 먹지)</title>
  <style>
    :root {
      --bg-top: #fffaf5; --bg-bot: #fff3e8; --card-bg: #ffffff;
      --text-main: #2f2f2f; --text-sub: #6c6c6c; --border-color: #f0e5da;
      --weather-bg: #fff7f0; --weather-border: #f4dfcf; --input-bg: #ffffff;
      --input-border: #d8d8d8; --result-bg: #fffdfb; --tag-bg: #fff0e9;
      --tag-text: #a6583a; --reason-bg: #f9f5f0; --btn-primary: #ff6b35;
      --btn-primary-hover: #e55a2b; --shadow: rgba(0,0,0,0.06);
    }
    [data-theme="dark"] {
      --bg-top: #1a1a1a; --bg-bot: #121212; --card-bg: #242424;
      --text-main: #e0e0e0; --text-sub: #a0a0a0; --border-color: #333333;
      --weather-bg: #2f2f2f; --weather-border: #444444; --input-bg: #333333;
      --input-border: #555555; --result-bg: #2a2a2a; --tag-bg: #3d2a23;
      --tag-text: #ffa280; --reason-bg: #1f1f1f; --shadow: rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%); color: var(--text-main); transition: background 0.3s ease, color 0.3s ease; min-height: 100vh; }
    .header-nav { max-width: 860px; margin: 0 auto; padding: 16px 20px 0; display: flex; justify-content: flex-end; }
    .theme-toggle { background: none; border: none; font-size: 24px; cursor: pointer; padding: 8px; border-radius: 50%; width: 44px; transition: background 0.2s; color: var(--text-main); }
    .theme-toggle:hover { background: rgba(128,128,128,0.1); }
    .container { max-width: 860px; margin: 20px auto 48px; padding: 0 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 28px; box-shadow: 0 10px 24px var(--shadow); transition: all 0.3s ease; }
    h1 { margin: 0 0 8px; font-size: 34px; text-align: center; font-weight: 800; letter-spacing: -1px; }
    .subtitle { text-align: center; color: var(--text-sub); margin-bottom: 24px; line-height: 1.6; font-size: 15px; }
    .subtitle strong { color: var(--btn-primary); font-size: 1.15em; font-weight: 800; }
    .weather-box { background: var(--weather-bg); border: 1px solid var(--weather-border); border-radius: 16px; padding: 16px; margin-bottom: 24px; transition: all 0.3s ease; }
    .weather-line { margin: 6px 0; font-weight: 600; font-size: 15px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; letter-spacing: -0.5px; }
    select, button { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--input-border); font-size: 15px; font-weight: 500; background: var(--input-bg); color: var(--text-main); transition: all 0.2s ease; cursor: pointer; }
    select:focus { outline: none; border-color: var(--btn-primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.15); }
    button { border: none; background: var(--btn-primary); color: white; font-weight: 800; font-size: 16px; }
    button:hover:not(:disabled) { background: var(--btn-primary-hover); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,107,53,0.3); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
    .secondary-btn { background: #4a6fa5; }
    .secondary-btn:hover:not(:disabled) { background: #3b5a86; box-shadow: 0 4px 12px rgba(74,111,165,0.3); }
    .loading-container { display: none; text-align: center; padding: 40px 0; margin-top: 22px; }
    .spinner { width: 44px; height: 44px; border: 4px solid rgba(255, 107, 53, 0.2); border-top-color: var(--btn-primary); border-radius: 50%; animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result-card { margin-top: 24px; padding: 24px; border-radius: 20px; background: var(--result-bg); border: 2px solid var(--border-color); display: none; text-align: center; opacity: 0; transform: translateY(20px); animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    .result-title { font-size: 28px; font-weight: 800; margin-bottom: 16px; color: var(--btn-primary); word-break: keep-all; }
    .result-image-container { width: 100%; height: 260px; border-radius: 16px; overflow: hidden; margin-bottom: 20px; background: var(--border-color); display: none; box-shadow: 0 8px 16px rgba(0,0,0,0.08); }
    .result-image-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .result-image-container img:hover { transform: scale(1.04); }
    .result-sub { color: var(--text-sub); margin-bottom: 20px; font-size: 15px; line-height: 1.5; background: var(--reason-bg); padding: 14px; border-radius: 12px; font-weight: 500; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
    .tag { background: var(--tag-bg); color: var(--tag-text); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 800; }
    .action-group { display: flex; flex-direction: column; gap: 12px; }
    .action-row { display: flex; gap: 12px; }
    .maps-btn { display: block; width: 100%; padding: 16px; border-radius: 14px; background: #fee500; color: #191919; text-decoration: none; font-weight: 800; transition: 0.2s ease; text-align: center; font-size: 16px; }
    .maps-btn:hover { background: #ecd400; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(254,229,0,0.4); }
    .share-btn { background: #2ecc71; color: white; border: none; padding: 16px; border-radius: 14px; }
    .share-btn:hover:not(:disabled) { background: #27ae60; box-shadow: 0 4px 12px rgba(46,204,113,0.3); }
    .retry-btn { background: var(--input-bg); color: var(--text-main); border: 2px solid var(--input-border); padding: 14px; border-radius: 14px; }
    .exclude-btn { background: #fff0f0; color: #e74c3c; border: 2px solid #fadbd8; padding: 14px; border-radius: 14px; }
    [data-theme="dark"] .exclude-btn { background: #3d1c1c; color: #ff8a8a; border: 2px solid #5c2b2b; }
    .history-box { margin-top: 32px; padding: 20px; background: var(--weather-bg); border-radius: 16px; border: 1px dashed var(--border-color); display: none; }
    .history-box h3 { margin: 0 0 14px; font-size: 16px; color: var(--text-main); text-align: center; display: flex; justify-content: space-between; align-items: center; font-weight: 800; }
    .clear-history { font-size: 13px; color: #888; cursor: pointer; background: none; border: none; padding: 6px 10px; width: auto; font-weight: 600; }
    .clear-history:hover { text-decoration: underline; background: none; color: #555; transform: none; box-shadow: none; }
    .history-list { list-style: none; padding: 0; margin: 0; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .history-item { background: var(--card-bg); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 999px; font-size: 14px; color: var(--text-sub); font-weight: 600; box-shadow: 0 2px 6px var(--shadow); }
    .history-item.excluded { text-decoration: line-through; opacity: 0.5; background: transparent; box-shadow: none; }
    #toast { visibility: hidden; min-width: 280px; background-color: rgba(33,33,33,0.9); color: #fff; text-align: center; border-radius: 12px; padding: 16px; position: fixed; z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px); font-size: 15px; font-weight: 600; opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 8px 24px rgba(0,0,0,0.2); backdrop-filter: blur(4px); }
    #toast.show { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 700px) { .grid, .action-row { grid-template-columns: 1fr; flex-direction: column; } .result-title { font-size: 24px; } }
  </style>
</head>
<body>
  <div class="header-nav">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="다크/라이트 모드 변경">☀️</button>
  </div>

  <div class="container">
    <div class="card">
      <h1>오점뭐? 🍽️</h1>
      <div class="subtitle">
        <strong>AI가 말아주는 런치 룰렛 🎯</strong><br>
        날씨, 내 상태, 지갑 사정까지 싹 다 맞춘 취향저격 점심 큐레이터
      </div>

      <div class="weather-box" id="weatherContainer">
        <div class="weather-line" id="locationText">📍 위치: 위치 패치 중... 🛰️</div>
        <div class="weather-line" id="weatherText">🌤️ 날씨: 공기를 읽는 중... 💨</div>
        <div class="weather-line" id="weatherGuide">💡 위치 허용해주시면 날씨까지 찰떡같이 맞춰드려요!</div>
      </div>

      <div class="grid">
        <div>
          <label for="mood">🧠 지금 내 상태는?</label>
          <select id="mood">
            <option value="당떨어짐">당 떨어짐 (혈당 스파이크 시급 🍩)</option>
            <option value="스트레스">스트레스 폭발 (매운맛 수혈 필수 🌋)</option>
            <option value="귀찮음">만사 귀찮음 (아무거나 입에 넣기 🦥)</option>
            <option value="갓생">갓생 살기 (가벼운 클린식 🥗)</option>
            <option value="국밥바이브">뜨끈한 국밥 바이브 (K-소울푸드 🍲)</option>
            <option value="개운">기력 보충이 필요할 때 (에너지 충전/개운식 ✨)</option>
          </select>
        </div>
        
        <div>
          <label for="type">🍱 끌리는 장르는?</label>
          <select id="type">
            <option value="한식">K-푸드 (한식 🍚)</option>
            <option value="양식">양식/브런치 (분위기 한 스푼 🍝)</option>
            <option value="일식">일식/카츠 (깔끔한 한 끼 🍣)</option>
            <option value="중식">중식/마라 (자극 끝판왕 🥟)</option>
            <option value="아시안">아시안 (쌀국수/팟타이 등 🍜)</option>
            <option value="분식">분식/패스트푸드 (빠르고 간단하게 🍔)</option>
            <option value="랜덤">AI 맘대로 (선택장애 옴 🎲)</option>
          </select>
        </div>

        <div>
          <label for="spice">🌶️ 맵부심 정도?</label>
          <select id="spice">
            <option value="상관없음">상관없음 (맛만 있으면 됨 😋)</option>
            <option value="맵찔이">맵찔이 (순한맛 플리즈 🍼)</option>
            <option value="적당히">적당히 매콤 (신라면 정도 🔥)</option>
            <option value="맵부심">맵부심 폭발 (마라/불닭 컴온! 🌋)</option>
          </select>
        </div>

        <div>
          <label for="companion">👥 누구랑 먹어? (상황)</label>
          <select id="companion">
            <option value="혼밥">프로 혼밥러 (유튜브 필수 📱)</option>
            <option value="동료와">동기/팀원들과 다같이 (호불호 없는 메뉴 🤝)</option>
            <option value="법카">법카 찬스 (팀장님 안 계신 날 눈치껏 비싼거 💳)</option>
            <option value="바쁨">바쁜 직장인/대학원생 모드 (빛의 속도로 흡입 ⏱️)</option>
          </select>
        </div>

        <div style="grid-column: 1 / -1;">
          <label for="budget">💸 지갑 사정은?</label>
          <select id="budget">
            <option value="적당히">적당히 낼게요 (일반적인 한 끼 💵)</option>
            <option value="가성비">가성비 챙겨 (텅장주의 💸)</option>
            <option value="플렉스">오늘 내가 쏜다! (파워 플렉스 💎)</option>
          </select>
        </div>

        <button class="secondary-btn" onclick="loadWeather()" type="button" style="grid-column: 1 / -1;">🌍 현재 위치/날씨 업데이트</button>
        <button id="recommendBtn" onclick="startRecommendation()" type="button" style="grid-column: 1 / -1;">🚀 AI 점심 추천받기</button>
      </div>

      <div class="loading-container" id="loadingContainer">
        <div class="spinner"></div>
        <div id="loadingText" style="color: var(--text-main); font-weight: 700;">AI가 최적의 런치 코스를 계산 중입니다... 🧠</div>
      </div>

      <div class="result-card" id="resultCard">
        <div class="result-title" id="resultTitle"></div>
        <div class="result-image-container" id="resultImageContainer">
          <img id="resultImage" src="" alt="추천 메뉴 AI 이미지" />
        </div>
        <div class="tags" id="resultTags"></div>
        <div class="result-sub" id="resultReason"></div>
        
        <div class="action-group">
          <a href="#" id="mapsLink" target="_blank" class="maps-btn">📍 카카오맵에서 내 주변 맛집 찢기</a>
          <button onclick="shareResult()" class="share-btn">💌 동료에게 이 메뉴 꼬시기 (공유)</button>
          <div class="action-row">
            <button onclick="startRecommendation()" class="retry-btn">🔄 다른 거 먹을래 (다시)</button>
            <button onclick="excludeAndRecommend()" class="exclude-btn">🚫 이건 절대 안 먹어 (제외)</button>
          </div>
        </div>
      </div>

      <div class="history-box" id="historyBox">
        <h3>
          <span>🕒 나의 점심 유니버스</span>
          <button class="clear-history" onclick="clearData()">기억 지우기</button>
        </h3>
        <ul class="history-list" id="historyList"></ul>
      </div>

    </div>
  </div>

  <div id="toast"></div>

  <script>
    function toggleTheme() {
      const body = document.body;
      const toggleBtn = document.getElementById("themeToggle");
      if (body.getAttribute("data-theme") === "dark") {
        body.removeAttribute("data-theme"); toggleBtn.innerText = "☀️"; localStorage.setItem("theme", "light");
      } else {
        body.setAttribute("data-theme", "dark"); toggleBtn.innerText = "🌙"; localStorage.setItem("theme", "dark");
      }
    }

    let weatherState = { loaded: false, city: null, temperature: null, weatherLabel: null, isRainy: false, isHot: false, isCold: false };
    let excludedMenus = JSON.parse(localStorage.getItem('excludedMenus')) || [];
    let historyMenus = JSON.parse(localStorage.getItem('historyMenus')) || [];
    let currentMenu = "";

    const weatherCodeMap = {
      0: "맑음", 1: "대체로 맑음", 2: "부분적으로 흐림", 3: "흐림", 45: "안개", 48: "서리 안개", 
      51: "약한 이슬비", 53: "이슬비", 55: "강한 이슬비", 61: "약한 비", 63: "비", 65: "강한 비",
      71: "약한 눈", 73: "눈", 75: "강한 눈", 80: "소나기", 81: "소나기", 82: "강한 소나기", 95: "뇌우"
    };

    // 대폭 확장된 메뉴 데이터베이스
    const baseMenus = {
      한식: {
        당떨어짐: ["불고기 백반", "제육볶음", "갈비찜", "뚝배기 불고기"],
        스트레스: ["쭈꾸미볶음", "매운 갈비찜", "닭갈비", "낙지볶음", "오징어볶음"],
        귀찮음: ["비빔밥", "김밥천국 정식", "한솥도시락", "참치김치찌개"],
        갓생: ["보리비빔밥", "쌈밥", "우렁된장찌개", "두부김치", "육회비빔밥"],
        국밥바이브: ["돼지국밥", "순대국", "뼈해장국", "설렁탕", "감자탕"],
        개운: ["삼계탕", "전복죽", "소고기 뭇국", "장어구이 정식", "추어탕"] // 기력/개운 카테고리
      },
      양식: {
        당떨어짐: ["크림 파스타", "수제버거", "베이컨 크림 리조또", "바비큐 폭립"],
        스트레스: ["매운 토마토 파스타", "페퍼로니 피자", "라자냐", "핫치킨 피자"],
        귀찮음: ["샌드위치", "맥도날드/버거킹", "서브웨이", "토스트"],
        갓생: ["샐러드볼", "닭가슴살 포케", "아보카도 샌드위치", "단호박 샐러드"],
        국밥바이브: ["따뜻한 스프와 빵", "스튜", "굴라쉬", "어니언 스프"],
        개운: ["안심 스테이크", "트러플 파스타", "연어 파피요트", "관자 리조또"]
      },
      일식: {
        당떨어짐: ["돈까스", "텐동", "가츠동", "치킨가라아게동"],
        스트레스: ["매운 카레", "탄탄멘", "매운 돈코츠 라멘", "김치 가츠동"],
        귀찮음: ["편의점 삼각김밥", "유부초밥", "우동", "가라아게"],
        갓생: ["연어 덮밥(사케동)", "낫또 덮밥", "메밀소바", "연어 샐러드"],
        국밥바이브: ["우동 정식", "밀푀유 나베", "돈코츠 라멘", "스끼야끼"],
        개운: ["장어덮밥(우나기동)", "스시 오마카세", "카이센동", "참치 덮밥"]
      },
      중식: {
        당떨어짐: ["짜장면", "새우 볶음밥", "탕수육", "꿔바로우"],
        스트레스: ["마라탕", "불닭 짬뽕", "마라샹궈", "깐풍기", "지삼선"],
        귀찮음: ["중국집 볶음밥", "짬짜면", "군만두", "마파두부 덮밥"],
        갓생: ["토마토 달걀 볶음", "청경채 볶음", "해물 누룽지탕", "야채죽"],
        국밥바이브: ["짬뽕밥", "백짬뽕", "우육면", "굴짬뽕"],
        개운: ["멘보샤", "유산슬", "북경오리", "동파육"]
      },
      아시안: {
        당떨어짐: ["팟타이", "나시고랭", "뿌팟퐁커리", "파인애플 볶음밥"],
        스트레스: ["마라샹궈", "똠얌꿍", "매운 소고기 쌀국수", "마라 쌀국수"],
