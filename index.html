<html lang="ko">
<head>

  <meta property="og:title" content="JY의 점심 고민을 해결하는 AI 맞춤 추천">
  <meta property="og:description" content="날씨, 기분, 장르를 고려해 완벽한 점심 메뉴를 추천해 드립니다.">

  <style>
    :root {
      --bg-top: #fffaf5; --bg-bot: #fff3e8; --card-bg: #ffffff;
      --text-main: #2f2f2f; --text-sub: #6c6c6c; --border-color: #f0e5da;
      --weather-bg: #fff7f0; --weather-border: #f4dfcf; --input-bg: #ffffff;
      --input-border: #d8d8d8; --result-bg: #fffdfb; --tag-bg: #fff0e9;
      --tag-text: #a6583a; --reason-bg: #f9f5f0; --btn-primary: #ff6b35;
      --btn-primary-hover: #e55a2b; --shadow: rgba(0,0,0,0.06);
    }
    [data-theme="dark"] {
      --bg-top: #1a1a1a; --bg-bot: #121212; --card-bg: #242424;
      --text-main: #e0e0e0; --text-sub: #a0a0a0; --border-color: #333333;
      --weather-bg: #2f2f2f; --weather-border: #444444; --input-bg: #333333;
      --input-border: #555555; --result-bg: #2a2a2a; --tag-bg: #3d2a23;
      --tag-text: #ffa280; --reason-bg: #1f1f1f; --shadow: rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%); color: var(--text-main); transition: background 0.3s ease, color 0.3s ease; min-height: 100vh; display: flex; flex-direction: column; }
    .header-nav { max-width: 860px; margin: 0 auto; padding: 16px 20px 0; display: flex; justify-content: flex-end; width: 100%; }
    .theme-toggle { background: none; border: none; font-size: 24px; cursor: pointer; padding: 8px; border-radius: 50%; width: 44px; transition: background 0.2s; color: var(--text-main); }
    .theme-toggle:hover { background: rgba(128,128,128,0.1); }
    .container { max-width: 860px; margin: 20px auto 48px; padding: 0 20px; flex: 1; width: 100%; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 28px; box-shadow: 0 10px 24px var(--shadow); transition: all 0.3s ease; }
    h1 { margin: 0 0 12px; font-size: 28px; text-align: center; font-weight: 800; letter-spacing: -0.5px; color: var(--btn-primary); line-height: 1.3; }
    .subtitle { text-align: center; color: var(--text-sub); margin-bottom: 24px; line-height: 1.6; font-size: 15px; }
    .weather-box { background: var(--weather-bg); border: 1px solid var(--weather-border); border-radius: 16px; padding: 16px; margin-bottom: 24px; transition: all 0.3s ease; }
    .weather-line { margin: 6px 0; font-weight: 600; font-size: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; letter-spacing: -0.5px; color: var(--text-main); }
    select, button { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--input-border); font-size: 15px; font-weight: 500; background: var(--input-bg); color: var(--text-main); transition: all 0.2s ease; cursor: pointer; }
    select:focus { outline: none; border-color: var(--btn-primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.15); }
    button { border: none; background: var(--btn-primary); color: white; font-weight: 700; font-size: 16px; }
    button:hover:not(:disabled) { background: var(--btn-primary-hover); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,107,53,0.2); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
    .secondary-btn { background: #4a6fa5; }
    .secondary-btn:hover:not(:disabled) { background: #3b5a86; box-shadow: 0 4px 12px rgba(74,111,165,0.2); }
    .loading-container { display: none; text-align: center; padding: 40px 0; margin-top: 22px; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(255, 107, 53, 0.2); border-top-color: var(--btn-primary); border-radius: 50%; animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result-card { margin-top: 24px; padding: 24px; border-radius: 20px; background: var(--result-bg); border: 2px solid var(--border-color); display: none; text-align: center; opacity: 0; transform: translateY(20px); animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    .result-title { font-size: 24px; font-weight: 800; margin-bottom: 20px; color: var(--text-main); word-break: keep-all; line-height: 1.4; }
    .result-title span { color: var(--btn-primary); font-size: 28px; display: block; margin-top: 8px; }
    .result-sub { color: var(--text-sub); margin-bottom: 20px; font-size: 15px; line-height: 1.6; background: var(--reason-bg); padding: 18px; border-radius: 12px; font-weight: 500; text-align: left; border: 1px solid var(--border-color); }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
    .tag { background: var(--tag-bg); color: var(--tag-text); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 700; }
    .action-group { display: flex; flex-direction: column; gap: 10px; }
    .action-row { display: flex; gap: 10px; }
    .maps-btn { display: block; width: 100%; padding: 14px; border-radius: 12px; background: #fee500; color: #191919; text-decoration: none; font-weight: 700; transition: 0.2s ease; text-align: center; font-size: 15px; }
    .maps-btn:hover { background: #ecd400; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(254,229,0,0.3); }
    .share-btn { background: #2ecc71; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; }
    .share-btn:hover:not(:disabled) { background: #27ae60; box-shadow: 0 4px 12px rgba(46,204,113,0.3); }
    .retry-btn { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--input-border); padding: 14px; border-radius: 12px; font-size: 15px; }
    .exclude-btn { background: #fff0f0; color: #e74c3c; border: 1px solid #fadbd8; padding: 14px; border-radius: 12px; font-size: 15px; }
    [data-theme="dark"] .exclude-btn { background: #3d1c1c; color: #ff8a8a; border: 1px solid #5c2b2b; }
    .history-box { margin-top: 32px; padding: 20px; background: var(--weather-bg); border-radius: 16px; border: 1px dashed var(--border-color); display: none; }
    .history-box h3 { margin: 0 0 14px; font-size: 15px; color: var(--text-main); text-align: center; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
    .clear-history { font-size: 13px; color: #888; cursor: pointer; background: none; border: none; padding: 6px 10px; width: auto; font-weight: 500; }
    .clear-history:hover { text-decoration: underline; background: none; color: #555; transform: none; box-shadow: none; }
    .history-list { list-style: none; padding: 0; margin: 0; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .history-item { background: var(--card-bg); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 999px; font-size: 13px; color: var(--text-sub); font-weight: 500; box-shadow: 0 2px 6px var(--shadow); }
    .history-item.excluded { text-decoration: line-through; opacity: 0.5; background: transparent; box-shadow: none; }
    #toast { visibility: hidden; min-width: 260px; background-color: rgba(33,33,33,0.9); color: #fff; text-align: center; border-radius: 10px; padding: 14px; position: fixed; z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px); font-size: 14px; font-weight: 500; opacity: 0; transition: all 0.3s ease; box-shadow: 0 8px 24px rgba(0,0,0,0.15); backdrop-filter: blur(4px); }
    #toast.show { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0); }
    footer { text-align: center; padding: 25px; color: var(--text-sub); font-size: 13px; margin-top: auto; border-top: 1px solid var(--border-color); background: rgba(0,0,0,0.02); }
    @media (max-width: 700px) { .grid, .action-row { grid-template-columns: 1fr; flex-direction: column; } .result-title { font-size: 20px; } .result-title span { font-size: 24px; } }
  </style>
</head>

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.innerText = message; toast.className = "show";
      setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    async function loadWeather() {
      const locationText = document.getElementById("locationText");
      const weatherText = document.getElementById("weatherText");
      
      if (!navigator.geolocation) { showToast("브라우저에서 위치 기능을 지원하지 않습니다."); return; }
      locationText.innerText = "현재 위치를 확인 중입니다..."; weatherText.innerText = "날씨 정보를 불러오는 중입니다...";

      navigator.geolocation.getCurrentPosition(async (position) => {
        try {
          const lat = position.coords.latitude; const lon = position.coords.longitude;
          const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`;
          const weatherData = await (await fetch(weatherUrl)).json();
          
          const temp = weatherData.current.temperature_2m;
          const code = weatherData.current.weather_code;
          const label = weatherCodeMap[code] || "확인 필요";

          let city = "현재 위치";
          try {
            const geoData = await (await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&language=ko`)).json();
            if (geoData.results?.length > 0) city = geoData.results[0].city || geoData.results[0].name || "현재 위치";
          } catch (e) {}

          weatherState = { loaded: true, city, temperature: temp, weatherLabel: label };

          locationText.innerText = `현재 위치: ${city}`;
          weatherText.innerText = `현재 날씨: ${label}, ${temp}°C`;
          
          showToast("날씨 정보가 업데이트되었습니다.");
        } catch (error) { showToast("날씨 정보를 불러오는데 실패했습니다."); }
      }, () => { showToast("위치 권한을 허용해주시면 더 정확한 추천이 가능합니다."); }, { timeout: 10000 });
    }

    function startRecommendation() {
      const btn = document.getElementById("recommendBtn");
      const resultCard = document.getElementById("resultCard");
      const loader = document.getElementById("loadingContainer");

      btn.disabled = true; resultCard.style.display = "none"; loader.style.display = "block";

      setTimeout(() => {
        loader.style.display = "none"; btn.disabled = false;
        recommendMenu();
      }, 1000); 
    }

    function excludeAndRecommend() {
      if (currentMenu && !excludedMenus.includes(currentMenu)) {
        excludedMenus.push(currentMenu);
        localStorage.setItem('excludedMenus', JSON.stringify(excludedMenus));
        showToast(`'${currentMenu}' 메뉴가 제외 목록에 추가되었습니다.`);
      }
      startRecommendation();
    }

    function clearData() {
      if(confirm("모든 추천 기록과 제외 목록을 초기화하시겠습니까?")) {
        historyMenus = []; excludedMenus = [];
        localStorage.removeItem('historyMenus'); localStorage.removeItem('excludedMenus');
        updateHistoryUI(); showToast("데이터가 초기화되었습니다.");
      }
    }

    function updateHistoryUI() {
      const historyBox = document.getElementById("historyBox");
      const historyList = document.getElementById("historyList");
      
      if (historyMenus.length > 0 || excludedMenus.length > 0) {
        historyBox.style.display = "block"; historyList.innerHTML = "";
        
        historyMenus.forEach(menu => {
          const li = document.createElement("li"); li.className = "history-item"; li.innerText = menu;
          historyList.appendChild(li);
        });

        excludedMenus.forEach(menu => {
          const li = document.createElement("li"); li.className = "history-item excluded"; li.innerText = `${menu} (제외됨)`;
          historyList.appendChild(li);
        });
      } else { historyBox.style.display = "none"; }
    }

    function recommendMenu() {
      const mood = document.getElementById("mood").value;
      const type = document.getElementById("type").value;
      const spice = document.getElementById("spice").value;

      let selectedType = type === "랜덤" ? ["한식", "양식", "일식", "중식", "아시안", "분식"][Math.floor(Math.random() * 6)] : type;
      
      // 1차 추출: 선택한 장르 안에서 선택한 기분 메뉴를 가져옴 (절대 이 장르를 안 벗어남)
      let candidates = [...baseMenus[selectedType][mood]];

      // 맵기 키워드 정의
      const spicyKeywords = ["마라", "짬뽕", "매운", "쭈꾸미", "불닭", "핫치킨", "엽기", "탄탄멘", "깐풍기", "똠얌", "떡볶이"];

      // 2차 필터링: 맵기 조건 반영
      if (spice === "맵부심" || spice === "적당히") {
        let spicyTemp = candidates.filter(m => spicyKeywords.some(k => m.includes(k)));
        if (spicyTemp.length > 0) {
          candidates = spicyTemp;
        } else {
          // 해당 기분에 매운 메뉴가 없다면, 그 '장르 전체'에서 매운 것을 가져옴
          let genreAll = [];
          for(let k in baseMenus[selectedType]) genreAll.push(...baseMenus[selectedType][k]);
          let genreSpicy = genreAll.filter(m => spicyKeywords.some(k => m.includes(k)));
          if (genreSpicy.length > 0) candidates = genreSpicy;
        }
      } else if (spice === "맵찔이") {
        let nonSpicyTemp = candidates.filter(m => !spicyKeywords.some(k => m.includes(k)));
        if (nonSpicyTemp.length > 0) {
          candidates = nonSpicyTemp;
        } else {
          // 해당 기분에 안 매운게 없으면, 장르 전체에서 안 매운 것을 가져옴
          let genreAll = [];
          for(let k in baseMenus[selectedType]) genreAll.push(...baseMenus[selectedType][k]);
          candidates = genreAll.filter(m => !spicyKeywords.some(k => m.includes(k)));
        }
      }

      // 블랙리스트 제외
      candidates = candidates.filter(m => !excludedMenus.includes(m));

      // 혹시라도 조건이 꼬여서 0개가 되었다면 기분+장르 기본값으로 복귀
      if (candidates.length === 0) {
        candidates = [...baseMenus[selectedType][mood]];
        showToast("조건이 까다로워 장르와 기분 위주로 추천합니다.");
      }

      // 최종 랜덤 선택
      currentMenu = candidates[Math.floor(Math.random() * candidates.length)];

      historyMenus.unshift(currentMenu);
      if (historyMenus.length > 4) historyMenus.pop(); 
      localStorage.setItem('historyMenus', JSON.stringify(historyMenus));
      updateHistoryUI();

      // 화면 출력
      document.getElementById("finalMenuName").innerText = `${currentMenu}`;
      
      let explainText = `🤖 AI 맞춤 분석 결과:\n`;
      explainText += `선택하신 [${selectedType}] 장르 중에서, `;
      explainText += `[${mood}] 상태에 딱 맞는 메뉴를 찾았습니다. `;
      if (weatherState.loaded) explainText += `오늘 ${weatherState.weatherLabel} 날씨와도 잘 어울릴 거예요!`;
      
      document.getElementById("resultReason").innerText = explainText;

      const tags = [selectedType, mood];
      if (spice !== "상관없음") tags.push(spice === "맵찔이" ? "순한맛" : spice === "적당히" ? "매콤" : "아주 맵게");
      
      const tagsContainer = document.getElementById("resultTags");
      tagsContainer.innerHTML = tags.map(t => `<span class="tag">#${t}</span>`).join("");

      const loc = weatherState.city && weatherState.city !== "현재 위치" ? weatherState.city : "";
      document.getElementById("mapsLink").href = `https://map.kakao.com/link/search/${loc} ${currentMenu} 맛집`;

      const resultCard = document.getElementById("resultCard");
      resultCard.style.display = "block";
      resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function shareResult() {
      if (!currentMenu) return;
      const shareText = `🍽️ JY의 점심 고민을 해결하는 AI 맞춤 추천!\n\n👉 오늘의 픽: ${currentMenu}\n\n결정 장애는 이제 그만! AI가 완벽한 점심 메뉴를 추천해 드립니다.`;
      if (navigator.share) {
        navigator.share({ title: 'AI 점심 추천', text: shareText }).catch(() => showToast("공유하기가 취소되었습니다."));
      } else {
        navigator.clipboard.writeText(shareText).then(() => { showToast("추천 결과가 클립보드에 복사되었습니다."); });
      }
    }

    window.addEventListener("load", () => {
      if (localStorage.getItem("theme") === "dark") {
        document.body.setAttribute("data-theme", "dark");
        document.getElementById("themeToggle").innerText = "🌙";
      }
      updateHistoryUI(); loadWeather();
    });
  </script>
</body>
</html>
