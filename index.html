<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 점심 뭐 먹지?</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #fffaf5 0%, #fff3e8 100%);
      color: #2f2f2f;
    }
    .container {
      max-width: 860px;
      margin: 48px auto;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #f0e5da;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.06);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #6c6c6c;
      margin-bottom: 24px;
    }
    .weather-box {
      background: #fff7f0;
      border: 1px solid #f4dfcf;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .weather-line {
      margin: 6px 0;
      color: #5b5b5b;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 14px;
    }
    select, button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #d8d8d8;
      font-size: 16px;
      background: white;
    }
    button {
      border: none;
      background: #ff8a65;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }
    button:hover { opacity: 0.92; transform: translateY(-1px); }
    .full { grid-column: 1 / -1; }
    .secondary-btn {
      background: #6c8cff;
    }
    .result-card {
      margin-top: 22px;
      padding: 22px;
      border-radius: 18px;
      background: #fffdfb;
      border: 1px solid #efe6dc;
      display: none;
    }
    .result-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .result-sub {
      color: #666;
      margin-bottom: 14px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .tag {
      background: #fff0e9;
      color: #a6583a;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
    }
    .footer-note {
      margin-top: 18px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }
    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .container {
        margin: 24px auto;
      }
      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🍽️ 오늘 점심 뭐 먹지?</h1>
      <div class="subtitle">현재 위치와 날씨, 오늘 기분까지 반영해서 메뉴를 추천해드려요.</div>

      <div class="weather-box">
        <div class="weather-line" id="locationText">📍 위치: 아직 불러오지 않았어요</div>
        <div class="weather-line" id="weatherText">🌤️ 날씨: 위치를 가져오면 자동 조회됩니다</div>
        <div class="weather-line" id="weatherGuide">💡 날씨에 따라 추천이 조금 달라져요</div>
      </div>

      <div class="grid">
        <div>
          <label for="mood">오늘 기분</label>
          <select id="mood">
            <option value="든든">든든하게</option>
            <option value="가볍게">가볍게</option>
            <option value="스트레스">스트레스 해소</option>
            <option value="건강">건강하게</option>
            <option value="기분전환">기분 전환</option>
          </select>
        </div>

        <div>
          <label for="type">음식 스타일</label>
          <select id="type">
            <option value="한식">한식</option>
            <option value="양식">양식</option>
            <option value="일식">일식</option>
            <option value="중식">중식</option>
            <option value="랜덤">랜덤</option>
          </select>
        </div>

        <div>
          <label for="spice">매운 음식 선호</label>
          <select id="spice">
            <option value="상관없음">상관없음</option>
            <option value="좋아함">좋아함</option>
            <option value="안좋아함">안 좋아함</option>
          </select>
        </div>

        <div>
          <label for="companion">점심 상황</label>
          <select id="companion">
            <option value="혼밥">혼밥</option>
            <option value="동료와">동료와</option>
            <option value="기분전환">기분 전환 필요</option>
          </select>
        </div>

        <button class="secondary-btn" onclick="loadWeather()" type="button">현재 위치/날씨 불러오기</button>
        <button onclick="recommendMenu()" type="button">추천받기</button>
      </div>

      <div class="result-card" id="resultCard">
        <div class="result-title" id="resultTitle"></div>
        <div class="result-sub" id="resultReason"></div>
        <div class="tags" id="resultTags"></div>
      </div>

      <div class="footer-note">
        위치 권한을 허용하면 현재 날씨를 반영해 더 세분화된 추천을 받을 수 있어요.
      </div>
    </div>
  </div>

  <script>
    let weatherState = {
      loaded: false,
      latitude: null,
      longitude: null,
      city: null,
      temperature: null,
      weatherCode: null,
      weatherLabel: null,
      isRainy: false,
      isHot: false,
      isCold: false
    };

    const weatherCodeMap = {
      0: "맑음",
      1: "대체로 맑음",
      2: "부분적으로 흐림",
      3: "흐림",
      45: "안개",
      48: "서리 안개",
      51: "약한 이슬비",
      53: "이슬비",
      55: "강한 이슬비",
      61: "약한 비",
      63: "비",
      65: "강한 비",
      71: "약한 눈",
      73: "눈",
      75: "강한 눈",
      80: "약한 소나기",
      81: "소나기",
      82: "강한 소나기",
      95: "뇌우"
    };

    const baseMenus = {
      한식: {
        든든: ["제육볶음", "김치찌개", "순두부찌개", "돼지국밥"],
        가볍게: ["비빔밥", "칼국수", "콩나물국밥", "잔치국수"],
        스트레스: ["쭈꾸미볶음", "부대찌개", "매운 갈비찜", "닭갈비"],
        건강: ["쌈밥", "된장찌개", "닭곰탕", "보리비빔밥"],
        기분전환: ["냉면", "돌솥비빔밥", "불고기덮밥", "떡볶이 정식"]
      },
      양식: {
        든든: ["파스타", "리조또", "햄버거", "스테이크 덮밥"],
        가볍게: ["샌드위치", "스프와 빵", "브런치 플레이트", "포케볼"],
        스트레스: ["매운 크림파스타", "피자", "치즈버거", "라자냐"],
        건강: ["샐러드볼", "그릴드 치킨 샐러드", "연어 포케", "아보카도 볼"],
        기분전환: ["트러플 파스타", "버섯리조또", "오믈렛 브런치", "포카치아 샌드위치"]
      },
      일식: {
        든든: ["돈까스", "규동", "우동 세트", "가츠동"],
        가볍게: ["소바", "초밥", "연어덮밥", "냉모밀"],
        스트레스: ["매운 라멘", "가라아게 카레", "탄탄멘", "매운 규동"],
        건강: ["사시미 덮밥", "메밀소바", "연어 샐러드", "두부 샐러드"],
        기분전환: ["스시 세트", "오야꼬동", "나베", "규카츠"]
      },
      중식: {
        든든: ["짜장면", "짬뽕밥", "마파두부 덮밥", "유산슬밥"],
        가볍게: ["계란볶음밥", "완탕면", "야채볶음면", "온면"],
        스트레스: ["마라탕", "짬뽕", "마라샹궈", "고추잡채밥"],
        건강: ["야채죽", "두부볶음덮밥", "청경채볶음면", "계란탕"],
        기분전환: ["유린기", "멘보샤 세트", "탄탄면", "볶음짬뽕"]
      }
    };

    const weatherMenus = {
      rainy: ["칼국수", "우동", "짬뽕", "국밥", "수제비", "나베"],
      hot: ["냉면", "메밀소바", "초밥", "포케", "샐러드볼", "냉모밀"],
      cold: ["찌개", "국밥", "라멘", "탕", "전골", "카레"]
    };

    async function loadWeather() {
      const locationText = document.getElementById("locationText");
      const weatherText = document.getElementById("weatherText");
      const weatherGuide = document.getElementById("weatherGuide");

      if (!navigator.geolocation) {
        locationText.innerText = "📍 위치: 이 브라우저에서는 위치 기능을 지원하지 않아요.";
        return;
      }

      locationText.innerText = "📍 위치: 현재 위치를 확인 중입니다...";
      weatherText.innerText = "🌤️ 날씨: 날씨를 조회 중입니다...";
      weatherGuide.innerText = "💡 잠시만 기다려주세요";

      navigator.geolocation.getCurrentPosition(async (position) => {
        try {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          weatherState.latitude = lat;
          weatherState.longitude = lon;

          // 현재 날씨
          const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`;
          const weatherRes = await fetch(weatherUrl);
          const weatherData = await weatherRes.json();

          const current = weatherData.current;
          const temp = current.temperature_2m;
          const code = current.weather_code;
          const label = weatherCodeMap[code] || "확인 필요";

          // 역지오코딩 (도시명)
          let city = "현재 위치";
          try {
            const geoUrl = `https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&language=ko`;
            const geoRes = await fetch(geoUrl);
            const geoData = await geoRes.json();
            if (geoData.results && geoData.results.length > 0) {
              const place = geoData.results[0];
              city = place.city || place.name || place.admin2 || place.admin1 || "현재 위치";
            }
          } catch (e) {
            city = "현재 위치";
          }

          weatherState.loaded = true;
          weatherState.city = city;
          weatherState.temperature = temp;
          weatherState.weatherCode = code;
          weatherState.weatherLabel = label;
          weatherState.isRainy = [51,53,55,61,63,65,80,81,82,95].includes(code);
          weatherState.isHot = temp >= 27;
          weatherState.isCold = temp <= 8;

          locationText.innerText = `📍 위치: ${city}`;
          weatherText.innerText = `🌤️ 날씨: ${label}, ${temp}°C`;

          let guide = "💡 오늘 날씨를 반영해서 추천해드릴게요";
          if (weatherState.isRainy) guide = "💡 비 오는 날에는 국물/따뜻한 메뉴에 가중치를 줄게요";
          else if (weatherState.isHot) guide = "💡 더운 날에는 시원하고 가벼운 메뉴를 더 반영할게요";
          else if (weatherState.isCold) guide = "💡 추운 날에는 따뜻하고 든든한 메뉴를 더 반영할게요";

          weatherGuide.innerText = guide;
        } catch (error) {
          locationText.innerText = "📍 위치: 위치는 가져왔지만 날씨 조회 중 오류가 발생했어요.";
          weatherText.innerText = "🌤️ 날씨: 다시 시도해주세요.";
          weatherGuide.innerText = "💡 추천은 계속 사용할 수 있어요";
        }
      }, (error) => {
        locationText.innerText = "📍 위치: 위치 권한이 없어서 기본 추천으로 진행할게요.";
        weatherText.innerText = "🌤️ 날씨: 위치 허용 시 날씨 반영 가능";
        weatherGuide.innerText = "💡 현재는 기분과 스타일만 반영합니다";
      }, {
        enableHighAccuracy: false,
        timeout: 10000,
        maximumAge: 300000
      });
    }

    function recommendMenu() {
      const mood = document.getElementById("mood").value;
      const type = document.getElementById("type").value;
      const spice = document.getElementById("spice").value;
      const companion = document.getElementById("companion").value;

      let selectedType = type;
      if (type === "랜덤") {
        const types = ["한식", "양식", "일식", "중식"];
        selectedType = types[Math.floor(Math.random() * types.length)];
      }

      let candidateMenus = [...baseMenus[selectedType][mood]];

      // 날씨 반영
      if (weatherState.loaded) {
        if (weatherState.isRainy) {
          candidateMenus = candidateMenus.concat(weatherMenus.rainy);
        }
        if (weatherState.isHot) {
          candidateMenus = candidateMenus.concat(weatherMenus.hot);
        }
        if (weatherState.isCold) {
          candidateMenus = candidateMenus.concat(weatherMenus.cold);
        }
      }

      // 매운 음식 선호 반영
      if (spice === "좋아함") {
        const spicyBoost = ["마라탕", "짬뽕", "매운 라멘", "쭈꾸미볶음", "닭갈비", "탄탄멘", "부대찌개"];
        candidateMenus = candidateMenus.concat(spicyBoost);
      } else if (spice === "안좋아함") {
        candidateMenus = candidateMenus.filter(menu => {
          const spicyWords = ["마라", "짬뽕", "매운", "쭈꾸미", "탄탄멘"];
          return !spicyWords.some(word => menu.includes(word));
        });
      }

      // 상황 반영
      if (companion === "혼밥") {
        const soloBoost = ["덮밥", "국밥", "우동", "소바", "포케", "샐러드볼", "볶음밥"];
        candidateMenus = candidateMenus.concat(
          candidateMenus.filter(menu => soloBoost.some(word => menu.includes(word)))
        );
      } else if (companion === "동료와") {
        const shareBoost = ["피자", "닭갈비", "부대찌개", "전골", "유린기", "떡볶이 정식"];
        candidateMenus = candidateMenus.concat(shareBoost);
      } else if (companion === "기분전환") {
        const freshBoost = ["브런치 플레이트", "포케볼", "초밥", "트러플 파스타", "냉면", "샌드위치"];
        candidateMenus = candidateMenus.concat(freshBoost);
      }

      // 후보 없을 때 대비
      if (candidateMenus.length === 0) {
        candidateMenus = ["비빔밥", "파스타", "우동", "짜장면"];
      }

      const menu = candidateMenus[Math.floor(Math.random() * candidateMenus.length)];

      const resultCard = document.getElementById("resultCard");
      const resultTitle = document.getElementById("resultTitle");
      const resultReason = document.getElementById("resultReason");
      const resultTags = document.getElementById("resultTags");

      resultTitle.innerText = `오늘의 추천 메뉴: ${menu}`;

      let reasonParts = [`${mood} 기분`, `${selectedType} 스타일`, `${companion} 상황`];
      if (weatherState.loaded) {
        reasonParts.unshift(`${weatherState.city}의 ${weatherState.weatherLabel} 날씨`);
      }
      resultReason.innerText = `${reasonParts.join(" + ")}를 반영해서 골라봤어요.`;

      const tags = [];
      tags.push(mood);
      tags.push(selectedType);
      tags.push(companion);
      if (spice !== "상관없음") tags.push(`매운맛 ${spice}`);
      if (weatherState.loaded) tags.push(`${weatherState.weatherLabel} ${weatherState.temperature}°C`);

      resultTags.innerHTML = "";
      tags.forEach(tag => {
        const span = document.createElement("span");
        span.className = "tag";
        span.innerText = tag;
        resultTags.appendChild(span);
      });

      resultCard.style.display = "block";
    }

    // 페이지 열리면 자동으로 한 번 시도
    window.addEventListener("load", () => {
      loadWeather();
    });
  </script>
</body>
</html>
