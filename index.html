<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 점심 추천</title>
  <style>
    :root {
      --bg-top: #f8f6f2;
      --bg-bottom: #f2ede7;
      --card-bg: #ffffff;
      --text-main: #2f2f2f;
      --text-sub: #6b6b6b;
      --border: #e7dfd5;
      --soft-bg: #f8f4ef;
      --input-bg: #ffffff;
      --input-border: #d7d2cb;
      --primary: #d46a4d;
      --primary-hover: #bf593d;
      --secondary: #6e7f95;
      --secondary-hover: #5c6c81;
      --danger-bg: #f7ece8;
      --danger-text: #b04f39;
      --tag-bg: #f4ece5;
      --tag-text: #8b5b45;
      --shadow: rgba(0, 0, 0, 0.06);
      --map-btn: #f5e16a;
      --map-btn-text: #222;
    }

    [data-theme="dark"] {
      --bg-top: #171717;
      --bg-bottom: #111111;
      --card-bg: #232323;
      --text-main: #e6e6e6;
      --text-sub: #aaaaaa;
      --border: #373737;
      --soft-bg: #2b2b2b;
      --input-bg: #2f2f2f;
      --input-border: #565656;
      --primary: #e07a5f;
      --primary-hover: #c9664d;
      --secondary: #7f90a8;
      --secondary-hover: #6d7f96;
      --danger-bg: #412824;
      --danger-text: #f0a189;
      --tag-bg: #3a302c;
      --tag-text: #efb292;
      --shadow: rgba(0, 0, 0, 0.2);
      --map-btn: #d8c95b;
      --map-btn-text: #1e1e1e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text-main);
      min-height: 100vh;
    }

    .topbar {
      max-width: 920px;
      margin: 0 auto;
      padding: 18px 20px 0;
      display: flex;
      justify-content: flex-end;
    }

    .theme-toggle {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    .container {
      max-width: 920px;
      margin: 10px auto 48px;
      padding: 0 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 10px 24px var(--shadow);
    }

    .heading {
      text-align: center;
      margin-bottom: 24px;
    }

    .label {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--soft-bg);
      border: 1px solid var(--border);
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.2;
      letter-spacing: -0.4px;
      font-weight: 800;
    }

    .subtitle {
      margin: 0;
      color: var(--text-sub);
      line-height: 1.6;
      font-size: 15px;
    }

    .weather-box {
      background: var(--soft-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 22px;
    }

    .weather-line {
      margin: 5px 0;
      font-size: 14px;
      color: var(--text-sub);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    select,
    button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 15px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-main);
      transition: 0.2s ease;
    }

    button {
      border: none;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover:not(:disabled),
    .map-link:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
    }

    .btn-secondary {
      background: var(--secondary);
    }

    .btn-light {
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--input-border);
    }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid transparent;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 28px 0 8px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 12px;
      border: 4px solid rgba(212,106,77,0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 600;
    }

    .result-card {
      display: none;
      margin-top: 24px;
      padding: 22px;
      border-radius: 18px;
      background: var(--soft-bg);
      border: 1px solid var(--border);
    }

    .result-title {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.3;
      color: var(--primary);
      margin-bottom: 12px;
      text-align: center;
    }

    .result-image-wrap {
      display: none;
      width: 100%;
      height: 250px;
      overflow: hidden;
      border-radius: 16px;
      margin-bottom: 16px;
      background: var(--border);
    }

    .result-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tag {
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 13px;
      font-weight: 700;
    }

    .reason {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-sub);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .map-link {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: var(--map-btn);
      color: var(--map-btn-text);
      padding: 14px;
      border-radius: 14px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .action-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .history-box {
      display: none;
      margin-top: 24px;
      padding: 16px;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1px dashed var(--border);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 700;
    }

    .history-reset {
      width: auto;
      padding: 4px 8px;
      background: transparent;
      color: var(--text-sub);
      border: none;
      font-size: 12px;
      cursor: pointer;
    }

    .history-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .history-item {
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--soft-bg);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-sub);
    }

    .history-item.excluded {
      text-decoration: line-through;
      opacity: 0.7;
    }

    .footer-note {
      margin-top: 18px;
      text-align: center;
      color: var(--text-sub);
      font-size: 13px;
      line-height: 1.6;
    }

    .toast {
      visibility: hidden;
      min-width: 220px;
      background: #333;
      color: #fff;
      text-align: center;
      border-radius: 10px;
      padding: 13px 16px;
      position: fixed;
      z-index: 999;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.25s ease, bottom 0.25s ease;
    }

    .toast.show {
      visibility: visible;
      opacity: 1;
      bottom: 42px;
    }

    @media (max-width: 740px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .action-row {
        flex-direction: column;
      }

      h1 {
        font-size: 29px;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="화면 모드 변경">☀</button>
  </div>

  <div class="container">
    <div class="card">
      <div class="heading">
        <div class="label">Personal Lunch Recommendation Service</div>
        <h1>오늘 점심 추천</h1>
        <p class="subtitle">
          현재 위치와 날씨, 오늘의 기분, 식사 상황을 반영해<br>
          지금 가장 잘 맞는 메뉴를 추천합니다.
        </p>
      </div>

      <div class="weather-box">
        <div class="weather-line" id="locationText">위치: 아직 불러오지 않았습니다.</div>
        <div class="weather-line" id="weatherText">날씨: 위치를 확인하면 자동으로 조회됩니다.</div>
        <div class="weather-line" id="weatherGuide">안내: 날씨를 반영하면 추천 정확도가 높아집니다.</div>
      </div>

      <div class="grid">
        <div>
          <label for="mood">오늘의 기분</label>
          <select id="mood">
            <option value="든든">든든하게 먹고 싶음</option>
            <option value="가볍게">가볍게 먹고 싶음</option>
            <option value="스트레스">매운 음식으로 스트레스 해소</option>
            <option value="건강">건강하게 먹고 싶음</option>
            <option value="기분전환">기분 전환이 필요함</option>
            <option value="힐링">편안한 메뉴가 좋음</option>
            <option value="활력">기운 나는 메뉴가 좋음</option>
          </select>
        </div>

        <div>
          <label for="type">음식 스타일</label>
          <select id="type">
            <option value="한식">한식</option>
            <option value="양식">양식</option>
            <option value="일식">일식</option>
            <option value="중식">중식</option>
            <option value="아시안">아시안</option>
            <option value="분식">분식</option>
            <option value="랜덤">랜덤</option>
          </select>
        </div>

        <div>
          <label for="spice">매운맛 선호</label>
          <select id="spice">
            <option value="상관없음">상관없음</option>
            <option value="안좋아함">매운 음식은 피하고 싶음</option>
            <option value="보통">적당한 매콤함은 가능</option>
            <option value="좋아함">매운 음식 선호</option>
          </select>
        </div>

        <div>
          <label for="companion">점심 상황</label>
          <select id="companion">
            <option value="혼밥">혼자 먹음</option>
            <option value="동료와">동료와 함께</option>
            <option value="회의전">회의 전후로 빠르게 식사</option>
            <option value="대화중심">대화하며 여유 있게 식사</option>
            <option value="기분전환">잠시 바깥 바람을 쐬고 싶음</option>
          </select>
        </div>

        <div>
          <label for="hunger">배고픔 정도</label>
          <select id="hunger">
            <option value="보통">보통</option>
            <option value="많이">많이 배고픔</option>
            <option value="살짝">가볍게 먹고 싶음</option>
          </select>
        </div>

        <div>
          <label for="budget">예산 기준</label>
          <select id="budget">
            <option value="상관없음">무난하게</option>
            <option value="가성비">가성비 우선</option>
            <option value="플렉스">조금 더 써도 괜찮음</option>
          </select>
        </div>

        <button class="btn-secondary full" onclick="loadWeather()" type="button">현재 위치 및 날씨 불러오기</button>
        <button class="btn-primary full" id="recommendBtn" onclick="startRecommendation()" type="button">추천 받기</button>
      </div>

      <div class="loading" id="loadingBox">
        <div class="spinner"></div>
        <div class="loading-text">조건을 바탕으로 메뉴를 찾고 있습니다.</div>
      </div>

      <div class="result-card" id="resultCard">
        <div class="result-title" id="resultTitle"></div>

        <div class="result-image-wrap" id="resultImageWrap">
          <img id="resultImage" src="" alt="추천 메뉴 이미지" />
        </div>

        <div class="tags" id="resultTags"></div>
        <div class="reason" id="resultReason"></div>

        <a href="#" id="mapLink" target="_blank" class="map-link">내 주변 식당 보기</a>

        <div class="action-row">
          <button class="btn-light" onclick="startRecommendation()">다시 추천 받기</button>
          <button class="btn-danger" onclick="excludeAndRecommend()">이 메뉴는 제외하고 다시 추천</button>
        </div>
      </div>

      <div class="history-box" id="historyBox">
        <div class="history-header">
          <span>최근 추천 기록</span>
          <button class="history-reset" onclick="clearData()">초기화</button>
        </div>
        <ul class="history-list" id="historyList"></ul>
      </div>

      <div class="footer-note">
        위치 권한을 허용하면 현재 날씨를 함께 반영해 더 적절한 추천을 받을 수 있습니다.
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

    const weatherMenus = {

    const menuImages = {

    const defaultFoodImage = "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800&h=500&fit=crop";

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function toggleTheme() {
      const body = document.body;
      const toggle = document.getElementById("themeToggle");
      if (body.getAttribute("data-theme") === "dark") {
        body.removeAttribute("data-theme");
        toggle.textContent = "☀";
        localStorage.setItem("theme", "light");
      } else {
        body.setAttribute("data-theme", "dark");
        toggle.textContent = "🌙";
        localStorage.setItem("theme", "dark");
      }
    }

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    async function loadWeather() {
      const locationText = document.getElementById("locationText");
      const weatherText = document.getElementById("weatherText");
      const weatherGuide = document.getElementById("weatherGuide");

      if (!navigator.geolocation) {
        showToast("현재 브라우저에서는 위치 기능을 지원하지 않습니다.");
        return;
      }

      locationText.textContent = "위치: 확인 중입니다.";
      weatherText.textContent = "날씨: 조회 중입니다.";
      weatherGuide.textContent = "안내: 잠시만 기다려주세요.";

      navigator.geolocation.getCurrentPosition(async (position) => {
        try {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`;
          const weatherData = await (await fetch(weatherUrl)).json();

          const temp = weatherData.current.temperature_2m;
          const code = weatherData.current.weather_code;
          const label = weatherCodeMap[code] || "확인 필요";

          let city = "현재 위치";
          try {
            const geoUrl = `https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&language=ko`;
            const geoData = await (await fetch(geoUrl)).json();
            if (geoData.results && geoData.results.length > 0) {
              city = geoData.results[0].city || geoData.results[0].name || "현재 위치";
            }
          } catch (e) {}

          weatherState = {
            loaded: true,
            latitude: lat,
            longitude: lon,
            city,
            temperature: temp,
            weatherLabel: label,
            isRainy: [51,53,55,61,63,65,71,73,75,80,81,82,95].includes(code),
            isHot: temp >= 27,
            isCold: temp <= 8
          };

          locationText.textContent = `위치: ${city}`;
          weatherText.textContent = `날씨: ${label}, ${temp}°C`;

          if (weatherState.isRainy) {
            weatherGuide.textContent = "안내: 비가 와서 따뜻한 국물 메뉴를 조금 더 반영합니다.";
          } else if (weatherState.isHot) {
            weatherGuide.textContent = "안내: 더운 날씨라 시원하고 가벼운 메뉴를 조금 더 반영합니다.";
          } else if (weatherState.isCold) {
            weatherGuide.textContent = "안내: 추운 날씨라 따뜻하고 든든한 메뉴를 조금 더 반영합니다.";
          } else {
            weatherGuide.textContent = "안내: 현재 날씨를 함께 고려해 추천합니다.";
          }

          showToast("위치와 날씨 정보를 불러왔습니다.");
        } catch (error) {
          locationText.textContent = "위치: 불러오지 못했습니다.";
          weatherText.textContent = "날씨: 기본 추천으로 진행합니다.";
          weatherGuide.textContent = "안내: 기분과 상황 중심으로 추천합니다.";
          showToast("날씨 정보를 가져오지 못했습니다.");
        }
      }, () => {
        locationText.textContent = "위치: 권한이 허용되지 않았습니다.";
        weatherText.textContent = "날씨: 위치 허용 시 자동 반영됩니다.";
        weatherGuide.textContent = "안내: 현재는 기본 조건으로 추천합니다.";
        showToast("위치 권한을 허용하면 더 정확한 추천이 가능합니다.");
      }, { timeout: 10000 });
    }

    function startRecommendation() {
      const loadingBox = document.getElementById("loadingBox");
      const resultCard = document.getElementById("resultCard");
      const recommendBtn = document.getElementById("recommendBtn");

      resultCard.style.display = "none";
      loadingBox.style.display = "block";
      recommendBtn.disabled = true;

      setTimeout(() => {
        loadingBox.style.display = "none";
        recommendBtn.disabled = false;
        recommendMenu();
      }, 1000);
    }

    function recommendMenu() {
      const mood = document.getElementById("mood").value;
      const type = document.getElementById("type").value;
      const spice = document.getElementById("spice").value;
      const companion = document.getElementById("companion").value;
      const hunger = document.getElementById("hunger").value;
      const budget = document.getElementById("budget").value;

      const selectedType = type === "랜덤"
        ? pickRandom(["한식", "양식", "일식", "중식", "아시안", "분식"])
        : type;

      let candidates = [...baseMenus[selectedType][mood]];

      if (weatherState.loaded) {
        if (weatherState.isRainy) candidates = candidates.concat(weatherMenus.rainy);
        if (weatherState.isHot) candidates = candidates.concat(weatherMenus.hot);
        if (weatherState.isCold) candidates = candidates.concat(weatherMenus.cold);
      }

      if (spice === "좋아함") {
        candidates = candidates.concat(["마라탕", "짬뽕", "매운 라멘", "쭈꾸미볶음", "닭갈비", "탄탄멘", "떡볶이"]);
      } else if (spice === "안좋아함") {
        candidates = candidates.filter(menu => {
          const spicyWords = ["마라", "짬뽕", "매운", "쭈꾸미", "탄탄멘"];
          return !spicyWords.some(word => menu.includes(word));
        });
      } else if (spice === "보통") {
        candidates = candidates.concat(["닭갈비", "짬뽕", "라볶이"]);
      }

      if (companion === "혼밥") {
        candidates = candidates.concat(
          candidates.filter(menu =>
            ["덮밥", "국밥", "우동", "소바", "볶음밥", "김밥", "면", "포케"].some(word => menu.includes(word))
          )
        );
      } else if (companion === "동료와") {
        candidates = candidates.concat(["피자", "닭갈비", "부대찌개", "유린기", "멘보샤", "떡볶이"]);
      } else if (companion === "회의전") {
        candidates = candidates.concat(["샌드위치", "김밥", "우동", "소바", "포케볼", "완탕면"]);
      } else if (companion === "대화중심") {
        candidates = candidates.concat(["브런치 플레이트", "리조또", "스키야키", "피자", "유린기"]);
      }

      if (hunger === "많이") {
        candidates = candidates.concat(["돼지국밥", "감자탕", "돈까스", "규동", "짜장면", "부대찌개"]);
      } else if (hunger === "살짝") {
        candidates = candidates.concat(["샐러드볼", "샌드위치", "초밥", "김밥", "냉모밀", "쫄면"]);
      }

      if (budget === "가성비") {
        const valueMenus = [
          "비빔밥", "칼국수", "잔치국수", "김치찌개", "된장찌개", "떡볶이",
          "샌드위치", "짜장면", "계란볶음밥", "볶음밥", "김밥", "우동", "완탕면", "쌀국수"
        ];
        const filtered = candidates.filter(menu => valueMenus.includes(menu));
        if (filtered.length > 0) candidates = filtered;
      } else if (budget === "플렉스") {
        candidates = candidates.concat(["스테이크 덮밥", "트러플 파스타", "사시미 덮밥", "유린기", "크림새우", "규카츠", "멘보샤", "스키야키"]);
      }

      candidates = candidates.filter(menu => !excludedMenus.includes(menu));

      if (candidates.length === 0) {
        excludedMenus = [];
        localStorage.removeItem("excludedMenus");
        candidates = ["비빔밥", "파스타", "우동 정식", "짜장면", "쌀국수"];
        showToast("제외 메뉴가 많아 목록을 초기화했습니다.");
      }

      currentMenu = pickRandom(candidates);

      historyMenus.unshift(currentMenu);
      if (historyMenus.length > 4) historyMenus.pop();
      localStorage.setItem("historyMenus", JSON.stringify(historyMenus));
      updateHistoryUI();

      renderResult({
        menu: currentMenu,
        mood,
        selectedType,
        spice,
        companion,
        hunger,
        budget
      });
    }

    function renderResult(context) {
      const resultCard = document.getElementById("resultCard");
      const resultTitle = document.getElementById("resultTitle");
      const resultTags = document.getElementById("resultTags");
      const resultReason = document.getElementById("resultReason");
      const mapLink = document.getElementById("mapLink");
      const resultImageWrap = document.getElementById("resultImageWrap");
      const resultImage = document.getElementById("resultImage");

      resultTitle.textContent = `오늘의 추천 메뉴는 ${context.menu}입니다.`;

      resultImage.src = menuImages[context.menu] || defaultFoodImage;
      resultImageWrap.style.display = "block";

      const tags = [context.mood, context.selectedType, context.companion];
      if (context.spice !== "상관없음") tags.push(context.spice);
      if (context.hunger === "많이") tags.push("든든한 식사");
      if (context.hunger === "살짝") tags.push("가벼운 식사");
      if (context.budget === "가성비") tags.push("가성비");
      if (context.budget === "플렉스") tags.push("여유 있는 예산");
      if (weatherState.loaded) tags.push(weatherState.weatherLabel);

      resultTags.innerHTML = tags.map(tag => `<span class="tag">${tag}</span>`).join("");

      const reasonParts = [];
      if (weatherState.loaded) {
        reasonParts.push(`${weatherState.city}의 ${weatherState.weatherLabel} 날씨`);
      }
      reasonParts.push(`오늘의 기분`);
      reasonParts.push(`음식 스타일`);
      reasonParts.push(`식사 상황`);

      if (context.hunger === "많이") {
        reasonParts.push(`포만감이 필요한 상태`);
      } else if (context.hunger === "살짝") {
        reasonParts.push(`가볍게 먹고 싶은 상태`);
      }

      if (context.budget === "가성비") {
        reasonParts.push(`예산 기준`);
      } else if (context.budget === "플렉스") {
        reasonParts.push(`조금 더 여유 있는 선택`);
      }

      resultReason.textContent =
        `${reasonParts.join(", ")}를 함께 고려해 추천했습니다. ` +
        `무작위 추천이 아니라 현재 조건에 조금 더 잘 맞는 메뉴에 가중치를 두었습니다.`;

      const loc = weatherState.city && weatherState.city !== "현재 위치" ? weatherState.city : "";
      mapLink.href = `https://map.kakao.com/link/search/${encodeURIComponent((loc ? loc + " " : "") + context.menu + " 맛집")}`;

      resultCard.style.display = "block";
      resultCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function excludeAndRecommend() {
      if (currentMenu && !excludedMenus.includes(currentMenu)) {
        excludedMenus.push(currentMenu);
        localStorage.setItem("excludedMenus", JSON.stringify(excludedMenus));
        showToast(`"${currentMenu}" 메뉴를 제외했습니다.`);
      }
      startRecommendation();
    }

    function updateHistoryUI() {
      const historyBox = document.getElementById("historyBox");
      const historyList = document.getElementById("historyList");

      if (historyMenus.length === 0 && excludedMenus.length === 0) {
        historyBox.style.display = "none";
        return;
      }

      historyBox.style.display = "block";
      historyList.innerHTML = "";

      historyMenus.forEach(menu => {
        const li = document.createElement("li");
        li.className = "history-item";
        li.textContent = menu;
        historyList.appendChild(li);
      });

      excludedMenus.forEach(menu => {
        const li = document.createElement("li");
        li.className = "history-item excluded";
        li.textContent = `${menu} 제외`;
        historyList.appendChild(li);
      });
    }

    function clearData() {
      if (!confirm("추천 기록과 제외 메뉴를 모두 초기화하시겠습니까?")) return;
      historyMenus = [];
      excludedMenus = [];
      localStorage.removeItem("historyMenus");
      localStorage.removeItem("excludedMenus");
      updateHistoryUI();
      showToast("기록을 초기화했습니다.");
    }

    window.addEventListener("load", () => {
      if (localStorage.getItem("theme") === "dark") {
        document.body.setAttribute("data-theme", "dark");
        document.getElementById("themeToggle").textContent = "🌙";
      }
      updateHistoryUI();
      loadWeather();
    });
  </script>
